<svg viewBox="0 0 860 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pankaj Chauhan — Tech Lead Engineer at Perfios Software Solutions. Agentic AI, Document AI and LLM pipelines. Highest trek 4,600 m.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1322"/>
      <stop offset="0.55" stop-color="#3a2c52"/>
      <stop offset="1" stop-color="#7a4a48"/>
    </linearGradient>
    <linearGradient id="ridgeBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ridgeFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151f"/><stop offset="1" stop-color="#0b0f16"/>
    </linearGradient>
  </defs>

  <rect width="860" height="230" rx="10" fill="url(#sky)"/>

  <!-- dawn sun -->
  <circle cx="790" cy="62" r="26" fill="#e8b066" opacity="0.92"/>
  <circle cx="790" cy="62" r="42" fill="#e8b066" opacity="0.14"/>

  <!-- stars -->
  <g fill="#cdd9e5" opacity="0.45">
    <circle cx="78" cy="26" r="1"/><circle cx="158" cy="140" r="1.1"/><circle cx="248" cy="22" r="1"/>
    <circle cx="420" cy="30" r="1"/><circle cx="470" cy="70" r="1"/><circle cx="380" cy="96" r="1"/>
    <circle cx="690" cy="28" r="1"/><circle cx="610" cy="20" r="1"/>
  </g>

  <!-- back ridge -->
  <path d="M0 168 L120 112 L210 152 L330 98 L440 152 L560 104 L690 158 L800 122 L860 152 L860 230 L0 230 Z"
        fill="url(#ridgeBack)" opacity="0.85"/>

  <!-- front ridge + snow caps -->
  <path d="M0 230 L0 198 L110 156 L190 192 L300 140 L400 186 L560 138 L660 190 L760 152 L860 192 L860 230 Z"
        fill="url(#ridgeFront)"/>
  <path d="M300 140 L285 155 L300 151 L312 161 L325 153 Z" fill="#dce6f2" opacity="0.8"/>
  <path d="M560 138 L546 152 L560 148 L572 158 L585 149 Z" fill="#dce6f2" opacity="0.85"/>

  <!-- summit flag on the highest peak, clear of the text -->
  <line x1="560" y1="66" x2="560" y2="138" stroke="#e0a458" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M560 66 L596 73 L560 82 Z" fill="#e0a458"/>
  <text x="604" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#e0a458" font-weight="600">4,600 m · highest summit</text>

  <!-- identity -->
  <text x="42" y="70" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#f2f5fa" letter-spacing="-0.8">Pankaj Chauhan</text>
  <text x="44" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#aebfda">Tech Lead Engineer · Perfios Software Solutions</text>
  <text x="44" y="117" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#8b949e">Agentic AI · Document AI · LLM pipelines at scale</text>
</svg>
