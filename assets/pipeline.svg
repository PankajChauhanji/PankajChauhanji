<svg viewBox="0 0 860 156" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Document extraction pipeline: raw PDF to layout and OCR to LLM extraction, with tamper check and validation, producing clean structured JSON.">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#5dcaa5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="156" rx="12" fill="#161b22" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">
    <g>
      <rect x="22" y="56" width="124" height="48" rx="8" fill="#1c222b" stroke="#30363d"/>
      <text x="84" y="78" font-size="11.5" fill="#e6edf3">Raw PDF</text>
      <text x="84" y="93" font-size="9" fill="#8b949e">scanned · native</text>
    </g>
    <g>
      <rect x="196" y="56" width="124" height="48" rx="8" fill="#1c222b" stroke="#7fb5e6"/>
      <text x="258" y="78" font-size="11.5" fill="#e6edf3">Layout + OCR</text>
      <text x="258" y="93" font-size="9" fill="#8b949e">PyMuPDF · OCR</text>
    </g>
    <g>
      <rect x="370" y="56" width="124" height="48" rx="8" fill="#1c222b" stroke="#c6b5f0"/>
      <text x="432" y="78" font-size="11.5" fill="#e6edf3">LLM extract</text>
      <text x="432" y="93" font-size="9" fill="#8b949e">RAG · classify</text>
    </g>
    <g>
      <rect x="544" y="26" width="128" height="44" rx="8" fill="#1c222b" stroke="#e0a458"/>
      <text x="608" y="46" font-size="11" fill="#e6edf3">Tamper check</text>
      <text x="608" y="60" font-size="9" fill="#8b949e">PDF forensics</text>
    </g>
    <g>
      <rect x="544" y="90" width="128" height="44" rx="8" fill="#1c222b" stroke="#5dcaa5"/>
      <text x="608" y="110" font-size="11" fill="#e6edf3">Validate</text>
      <text x="608" y="124" font-size="9" fill="#8b949e">98.6% accuracy</text>
    </g>
    <g>
      <rect x="712" y="56" width="124" height="48" rx="8" fill="#1c222b" stroke="#30363d"/>
      <text x="774" y="78" font-size="11.5" fill="#e6edf3">Clean JSON</text>
      <text x="774" y="93" font-size="9" fill="#8b949e">trusted data</text>
    </g>
  </g>

  <g stroke="#5dcaa5" stroke-width="1.4" fill="none" marker-end="url(#ar)">
    <path d="M146 80 H192"/>
    <path d="M320 80 H366"/>
    <path d="M494 74 C522 60, 522 50, 540 48"/>
    <path d="M494 86 C522 100, 522 110, 540 112"/>
    <path d="M672 48 C700 58, 700 68, 708 74"/>
    <path d="M672 112 C700 102, 700 92, 708 86"/>
  </g>
