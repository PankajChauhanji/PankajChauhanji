name: Generate Metrics

on:
  schedule:
    - cron: "0 */6 * * *"   # nightly at 04:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PIN_SYNC_TOKEN }}
          user: PankajChauhanji
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook
          config_timezone: Asia/Kolkata
          output_action: github
