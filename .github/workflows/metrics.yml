name: Generate Metrics

on:
  schedule:
    - cron: "15 */6 * * *"   # every 6 hours offset by 15 mins
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.PIN_SYNC_TOKEN }}
          committer_branch: output
          user: PankajChauhanji
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_ignored: jupyter notebook
          config_timezone: Asia/Kolkata
          output_action: commit

      - name: Generate commit calendar (self-hosted replacement for the live activity-graph widget)
        uses: lowlighter/metrics@latest
        with:
          filename: github-calendar.svg
          token: ${{ secrets.PIN_SYNC_TOKEN }}
          committer_branch: output
          user: PankajChauhanji
          template: classic
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Asia/Kolkata
          output_action: commit
