name: Profile assets (stats + snake)

# One workflow owns the `output` branch, so the stats cards and the snake can never
# overwrite each other (the old metrics and snake workflows both force-pushed it).
#
# Needs repository secret PIN_SYNC_TOKEN: a classic personal access token of
# PankajChauhanji with scopes `repo` and `read:user`. `repo` is what lets the stats
# include private repositories and private commits.

on:
  schedule:
    - cron: "20 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-assets.yml"

concurrency:
  group: profile-assets
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats cards (public + private)
        env:
          GH_TOKEN: ${{ secrets.PIN_SYNC_TOKEN }}
          STATS_TZ: Asia/Kolkata
          STATS_EXCLUDE_LANGS: Jupyter Notebook
        run: python .github/scripts/profile_stats.py --out dist

      - name: Contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: PankajChauhanji
          github_token: ${{ secrets.PIN_SYNC_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: refresh profile assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
